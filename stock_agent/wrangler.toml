name = "stock-agent"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# Two schedules, mapped to the two ingestion modes in src/ingestion/run.ts:
#   "0 6 * * *"  -- daily FULL run (5y price backfill + fundamentals/
#                   valuation + a prune of old snapshot rows). ~06:00 UTC is
#                   after US market close and covers the Stockholm session.
#   "0 * * * *"  -- hourly INCREMENTAL run (just the last 5 days of price
#                   bars, no fundamentals refetch) so entry-timing/valuation
#                   labels stay fresh through the day without re-pulling
#                   everything -- see src/ingestion/run.ts ingestTicker doc
#                   comment for the D1 free-tier write-budget math behind
#                   this split. index.ts scheduled() picks the mode from
#                   controller.cron.
[triggers]
crons = ["0 6 * * *", "0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "stock-agent-db"
database_id = "4b57c47b-d963-47bf-a9da-2e354eb92995"

[vars]
# Comma-separated list is also supported via config/universe.json (preferred).
# This var is a fallback / override hook for quick manual testing.
UNIVERSE_SOURCE = "config"

# Static assets (currently: the three Decision Lab demo videos, served via
# GET /assets/<key> -- see src/lib/assets.ts and README "Demo videos").
# Optional at the Env type level (ASSETS?: R2Bucket) so a deploy before
# you've created this bucket still works everywhere else -- /assets/*
# just returns a clear 503 until you run the one-time setup below.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "stock-agent-assets"
