name: Backtest & weight training

# Runs the learning loop (export -> dataset -> harness -> publish ->
# promotion/rollback gate, see stock_agent_v1_7/scripts/backtest.sh) on
# GitHub's own infrastructure instead of your Mac. Weekly by default; also
# runnable on demand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 8 * * 0" # every Sunday, 08:00 UTC
  workflow_dispatch:
    inputs:
      backtest_args:
        description: "Extra flags for scripts/backtest.sh (e.g. --no-tune)"
        required: false
        default: ""

defaults:
  run:
    working-directory: stock_agent_v1_7

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stock_agent_v1_7/package-lock.json

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stock_agent_v1_7/scripts/backtest/requirements.txt

      - name: Install Python deps
        # backtest.sh's own venv-creation/pip-install block only runs when
        # no --python is passed; passing --python below (so it uses the
        # runner's clean interpreter instead of creating a venv) means we
        # install requirements ourselves here instead.
        run: python3 -m pip install -r scripts/backtest/requirements.txt

      - name: Run backtest pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Runner's plain python3 (via --python), not backtest.sh's own
          # venv-creation path -- that path exists for interactive Mac use
          # (broken-venv/iCloud-lock recovery) and isn't needed here: the
          # runner is a fresh VM every time and setup-python above already
          # gives us a clean interpreter.
        run: |
          bash scripts/backtest.sh --python "$(which python3)" ${{ github.event.inputs.backtest_args }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: |
            stock_agent_v1_7/data/backtest_report.md
            stock_agent_v1_7/data/backtest_report.json
          retention-days: 90
