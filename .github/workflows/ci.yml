name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: stock_agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stock_agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
